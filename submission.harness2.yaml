name: ple-harness2-ablation
model_api: openai-compatible/mistralai/mistral-large-4-1t-a52b
model_base_url: https://integrate.api.nvidia.com/v1
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
  && npm install --prefix {src}/ablations/vendor/harness2/dependencies/tools bun@1.3.11
  && {src}/ablations/vendor/harness2/dependencies/tools/node_modules/.bin/bun install
  --cwd {src}/ablations/vendor/harness2/dependencies/opencode
  --frozen-lockfile --ignore-scripts
serve: /opt/harness/venv/bin/python {src}/serve_harness2.py
env:
  MAX_OUTPUT_TOKENS: "16000"

